# LifeMap — Mongo + Spark + Dask + Kafka (KRaft) + API Flask + Jenkins (+ ngrok opcional).
# Levantar: docker compose up -d --build     (copiar antes .env.example a .env)
# Sin bind mounts de código: todo se hornea en las imágenes, así Jenkins (que corre en un contenedor)
# puede desplegar con el socket de Docker sin problemas de rutas.
name: lifemap

x-dask: &dask
  image: lifemap-ingest:latest
  restart: unless-stopped

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: ["mongod", "--wiredTigerCacheSizeGB", "2"]
    volumes: [mongo_data:/data/db]
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- Dask: scheduler + 2 workers ----------
  dask-scheduler:
    <<: *dask
    build: ./ingest
    command: ["dask", "scheduler", "--port", "8786", "--dashboard-address", ":8787"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8786), 3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  dask-worker-1: &dask-worker
    <<: *dask
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "2GB", "--name", "worker-1"]
    depends_on:
      dask-scheduler: {condition: service_healthy}
    volumes: [data:/data]
    mem_limit: 2500m

  dask-worker-2:
    <<: *dask-worker
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "2GB", "--name", "worker-2"]

  # ---------- Spark: master + worker (imagen propia con los jobs y el conector de Mongo) ----------
  spark-master:
    build: ./spark
    image: lifemap-spark:latest
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    volumes: [data:/data, models:/models]
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-worker:
    image: lifemap-spark:latest
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "3g"
    depends_on:
      spark-master: {condition: service_healthy}
    volumes: [data:/data, models:/models]
    mem_limit: 3500m

  # ---------- Kafka en modo KRaft (sin ZooKeeper): un nodo que es broker y controlador a la vez ----------
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka_data:/var/lib/kafka/data]
    mem_limit: 900m
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Crea el topic `reviews` (3 particiones; los mensajes llevan clave business_id) y termina.
  kafka-init:
    image: apache/kafka:3.8.0
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists",
              "--topic", "reviews", "--partitions", "3", "--replication-factor", "1"]
    mem_limit: 256m

  # Productor con reloj acelerado (no arranca solo): docker compose run --rm producer --seconds-per-month 10
  producer:
    image: lifemap-ingest:latest
    profiles: ["stream"]
    working_dir: /app
    entrypoint: ["python", "producer.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CUTOFF_T: ${CUTOFF_T:-2021-01-19}
    volumes: [data:/data]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    mem_limit: 768m

  # ---------- Structured Streaming: Kafka -> inferencia -> MongoDB (+ ventanas por geohash) ----------
  # Corre en modo local (STREAM_MASTER) para no competir con los trabajos batch por el worker. Espera a que exista el modelo.
  stream:
    image: lifemap-spark:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-lifemap}
      KAFKA_BOOTSTRAP: kafka:9092
      CUTOFF_T: ${CUTOFF_T:-2021-01-19}
      MAX_OFFSETS_PER_TRIGGER: ${STREAM_BATCH:-5000}   # un mes de reseñas cada 10 s son ~700 mensajes/s: lotes de 5000 cada 5 s
    command: ["bash", "-c", "until [ -f /models/version.json ]; do echo 'esperando el modelo...'; sleep 5; done; exec /opt/spark/bin/spark-submit --master ${STREAM_MASTER:-local[2]} --driver-memory ${STREAM_MEMORY:-1500m} --conf spark.jars.ivy=/tmp/ivy /opt/jobs/stream_reviews.py"]
    volumes: ["models:/models:ro", "stream_ckpt:/checkpoints"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      mongo: {condition: service_healthy}
    mem_limit: 2400m   # con 1,5 GB de heap tocaba el límite anterior (1,6 GB) durante la reproducción completa

  # ---------- API Flask ----------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    image: lifemap-api:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-lifemap}
      SPARK_MASTER_UI: http://spark-master:8080
      DASK_SCHEDULER_UI: http://dask-scheduler:8787
      KAFKA_BOOTSTRAP: kafka:9092
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      mongo: {condition: service_healthy}
    volumes: ["models:/models:ro"]
    ports: ["80:5000"]
    mem_limit: 1300m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- Jenkins (CI/CD) ----------
  jenkins:
    build: ./jenkins
    image: lifemap-jenkins:latest
    restart: unless-stopped
    user: root   # socket de Docker del host
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      REPO_URL: ${REPO_URL:-https://github.com/elrios893/lifemap.git}
    ports: ["8088:8080", "50000:50000"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/run/secrets/lifemap.env:ro
    mem_limit: 1g

  # ---------- ngrok: URL fija para la API (perfil "tunnel": COMPOSE_PROFILES=tunnel en .env) ----------
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "--url=${NGROK_DOMAIN:-}", "api:5000"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  stream_ckpt:
  kafka_data:
  mongo_data:
  jenkins_home:
  data:
  models:
